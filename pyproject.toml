[project]
name = "nsm"
version = "0.1.0"
authors = [
    { name = "keejkrej", email = "ctyjackcao@outlook.com" }
]
description = "workflow-first CLI for NSM trajectory extraction and fit tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arviz>=0.18",
    "h5py>=3.11",
    "matplotlib>=3.8",
    "numpy>=2",
    "pymc>=5.16",
    "pywavelets>=1.5",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    "numba>=0.59",
]


[project.scripts]
nsm = "nsm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsm"]
