[project]
name = "ncs"
version = "0.1.0"
authors = [
    { name = "keejkrej", email = "ctyjackcao@outlook.com" }
]
description = "Visualize NCS HDF5 datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.11",
    "imageio>=2.33",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "numpy>=2",
]

[project.scripts]
ncs-viz = "ncs.viz:main"
ncs-statistics = "ncs.statistics:main"
ncs-preprocess = "ncs.preprocess:main"
ncs-movie-raw = "ncs.movie:main_movie_raw"
ncs-movie-preprocess = "ncs.movie:main_movie_preprocess"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncs"]
